<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The hero's black hole as a tab icon, drawn to the owner's sketch: a
       black square, a thin cream photon ring around the shadow, and the
       accretion disc as a thin amber line across the middle, reaching past
       the ring on both sides. Accent #ffb46e. (No double hyphens in XML comments.) -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#ffb46e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffb46e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb46e" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#ffb46e"/>
      <stop offset="0.5" stop-color="#ffd2a1"/>
      <stop offset="0.82" stop-color="#ffb46e"/>
      <stop offset="1" stop-color="#ffb46e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="#000"/>
  <circle cx="32" cy="32" r="24" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="15" fill="#000" stroke="#fff1df" stroke-width="3.2"/>
  <ellipse cx="32" cy="33" rx="27" ry="2.6" fill="none" stroke="url(#disc)" stroke-width="2.6"/>
</svg>
